<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Baby Tracker">

  <title>Baby Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f4ef;
      color: #332f2b;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 760px;
      margin: auto;
      padding: 20px 16px 100px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    .muted {
      color: #81786f;
      font-size: 13px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 16px;
      margin: 14px 0;
      box-shadow: 0 7px 22px rgba(0,0,0,.05);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .stat {
      background: white;
      border-radius: 16px;
      padding: 14px;
    }

    .stat b {
      display: block;
      font-size: 21px;
      margin-top: 5px;
    }

    .quick {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 14px 0;
    }

    .quick button {
      border: 0;
      border-radius: 18px;
      padding: 18px;
      text-align: left;
      font-weight: 700;
    }

    .feed-button {
      background: #f5dfe3;
    }

    .sleep-button {
      background: #e1edf5;
    }

    .activity-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .activity {
      background: white;
      border: 1px solid #e8e1d9;
      border-radius: 15px;
      padding: 11px 4px;
      text-align: center;
    }

    .activity span {
      display: block;
      font-size: 11px;
      margin-top: 4px;
    }

    .entry {
      display: flex;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .entry:last-child {
      border-bottom: 0;
    }

    .entry-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: #f4f1ed;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 19px;
    }

    .entry-main {
      flex: 1;
      min-width: 0;
    }

    .entry-actions button {
      border: 0;
      background: #f3efeb;
      border-radius: 8px;
      padding: 6px;
      margin-left: 3px;
    }

    .tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      border-top: 1px solid #e8e1d9;
      padding: 9px 16px calc(9px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      z-index: 10;
    }

    .tabs button {
      border: 0;
      background: none;
      color: #81786f;
    }

    .tabs button.active {
      color: #9a6871;
      font-weight: 700;
    }

    .tabs small {
      display: block;
      margin-top: 3px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      align-items: flex-end;
      z-index: 20;
    }

    .sheet {
      background: #f7f4ef;
      width: 100%;
      max-width: 760px;
      margin: auto;
      border-radius: 24px 24px 0 0;
      padding: 20px 16px calc(25px + env(safe-area-inset-bottom));
      max-height: 92vh;
      overflow-y: auto;
    }

    .field {
      margin: 11px 0;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #81786f;
      margin-bottom: 5px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #e8e1d9;
      border-radius: 12px;
      background: white;
    }

    .field textarea {
      min-height: 85px;
      resize: vertical;
    }

    .segment {
      display: flex;
      gap: 4px;
    }

    .segment button {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 11px;
      background: #e9e3dc;
    }

    .segment button.selected {
      background: white;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .primary,
    .secondary {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 13px;
      margin-top: 8px;
    }

    .primary {
      background: #9a6871;
      color: white;
    }

    .secondary {
      background: white;
    }

    .auth {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .auth-box {
      background: white;
      padding: 25px;
      border-radius: 25px;
      width: min(440px, 100%);
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }

    @media (min-width: 600px) {
      .stats {
        grid-template-columns: repeat(4, 1fr);
      }

      .modal {
        align-items: center;
        padding: 20px;
      }

      .sheet {
        border-radius: 25px;
      }
    }
  </style>
</head>

<body>

<div id="root"></div>

<div id="modal" class="modal">
  <div id="sheet" class="sheet"></div>
</div>

<nav id="tabs" class="tabs" style="display:none">
  <button data-tab="home" class="active">
    🏠
    <small>Today</small>
  </button>

  <button data-tab="history">
    📅
    <small>History</small>
  </button>

  <button data-tab="settings">
    ⚙️
    <small>Settings</small>
  </button>
</nav>

<script>

const SUPABASE_URL =
  "https://wetenneatwdebycegdbv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_F2FccdnlI-kbd3LO2qsI6A_TkG_cyD5";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let user = null;
let babies = [];
let baby = null;
let entries = [];
let currentTab = "home";
let selectedDate = getLocalDate();

function getLocalDate(date = new Date()) {
  return new Intl.DateTimeFormat("en-CA", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(date);
}

function dateTimeInput(date = new Date()) {
  return new Date(
    date.getTime() - date.getTimezoneOffset() * 60000
  ).toISOString().slice(0,16);
}

function displayTime(value) {
  return new Date(value).toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });
}

function duration(milliseconds) {
  const minutes = Math.max(
    0,
    Math.round(milliseconds / 60000)
  );

  if (minutes >= 60) {
    return (
      Math.floor(minutes / 60) +
      "h " +
      (minutes % 60) +
      "m"
    );
  }

  return minutes + "m";
}

function getDetails(entry) {
  return entry.details || {};
}

function entriesForDate() {
  return entries.filter(entry =>
    getLocalDate(new Date(entry.start_at)) === selectedDate
  );
}

function icon(type) {
  return {
    feed: "🍼",
    sleep: "😴",
    diaper: "🧷",
    medication: "💊",
    bath: "🛁",
    play: "🧸",
    mood: "😊"
  }[type] || "•";
}

function entryTitle(entry) {

  const d = getDetails(entry);

  if (entry.type === "feed") {
    return d.method === "breast"
      ? "Breastfeeding"
      : "Bottle feeding";
  }

  if (entry.type === "sleep") {
    return d.category === "night"
      ? "Night sleep"
      : "Nap";
  }

  if (entry.type === "diaper") {
    if (d.kind === "both") return "Wet + Dirty";
    if (d.kind === "wet") return "Wet diaper";
    return "Dirty diaper";
  }

  if (entry.type === "medication") {
    return d.name || "Medication";
  }

  if (entry.type === "bath") return "Bath";
  if (entry.type === "play") return "Play";

  return d.mood || "Mood";
}

function entryMeta(entry) {

  const d = getDetails(entry);

  let text = displayTime(entry.start_at);

  if (entry.end_at) {
    text += " – " + displayTime(entry.end_at);
  }

  if (entry.type === "feed") {

    if (d.method === "bottle") {
      text +=
        " • " +
        (d.amount || 0) +
        " oz • " +
        (d.source === "formula"
          ? "Formula"
          : "Breast milk");
    } else {
      text +=
        " • " +
        (d.side || "Both") +
        " • " +
        duration(
          (entry.end_at
            ? new Date(entry.end_at)
            : new Date()) -
          new Date(entry.start_at)
        );
    }
  }

  if (entry.type === "sleep") {
    text +=
      " • " +
      duration(
        (entry.end_at
          ? new Date(entry.end_at)
          : new Date()) -
        new Date(entry.start_at)
      );
  }

  if (entry.type === "medication") {
    text +=
      " • " +
      (d.dose || "") +
      " " +
      (d.unit || "");
  }

  if (entry.notes) {
    text += " • " + entry.notes;
  }

  return text;
}

function entryHTML(entry) {

  return `
    <div class="entry">

      <div class="entry-icon">
        ${icon(entry.type)}
      </div>

      <div class="entry-main">

        <b>${entryTitle(entry)}</b>

        <div class="muted">
          ${entryMeta(entry)}
        </div>

      </div>

      <div class="entry-actions">

        <button
          onclick="editEntry('${entry.id}')">
          Edit
        </button>

        <button
          onclick="deleteEntry('${entry.id}')">
          ×
        </button>

      </div>

    </div>
  `;
}

async function loadData() {

  const babiesResult =
    await db
      .from("babies")
      .select("*")
      .order("created_at");

  if (babiesResult.error) {
    alert(babiesResult.error.message);
    return;
  }

  babies = babiesResult.data || [];

  baby = babies[0] || null;

  if (!baby) {
    entries = [];
    return;
  }

  const entriesResult =
    await db
      .from("baby_entries")
      .select("*")
      .eq("baby_id", baby.id)
      .order("start_at", {
        ascending: false
      });

  if (!entriesResult.error) {
    entries = entriesResult.data || [];
  }
}

function showAuth() {

  tabs.style.display = "none";

  root.innerHTML = `

    <div class="auth">

      <div class="auth-box">

        <div style="font-size:42px">
          👶
        </div>

        <h1>Baby Tracker</h1>

        <p class="muted">
          Shared feeding, sleep and baby-care tracking.
        </p>

        <div class="field">
          <label>Email</label>
          <input
            id="email"
            type="email"
            autocomplete="email">
        </div>

        <div class="field">
          <label>Password</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password">
        </div>

        <button
          class="primary"
          onclick="signIn()">
          Sign in
        </button>

        <button
          class="secondary"
          onclick="signUp()">
          Create account
        </button>

        <p
          id="authMessage"
          class="muted">
        </p>

      </div>

    </div>
  `;
}

async function signIn() {

  const result =
    await db.auth.signInWithPassword({
      email: email.value,
      password: password.value
    });

  if (result.error) {
    authMessage.textContent =
      result.error.message;
  }
}

async function signUp() {

  const result =
    await db.auth.signUp({
      email: email.value,
      password: password.value
    });

  if (result.error) {
    authMessage.textContent =
      result.error.message;
  } else {
    authMessage.textContent =
      "Account created. Check your email if confirmation is required.";
  }
}

function showBabySetup() {

  root.innerHTML = `

    <div class="auth">

      <div class="auth-box">

        <h1>👶 Set up baby</h1>

        <p class="muted">
          Create the baby profile for your family.
        </p>

        <div class="field">

          <label>
            Baby name
          </label>

          <input
            id="newBabyName"
            placeholder="Baby">

        </div>

        <button
          class="primary"
          onclick="createBaby()">
          Create baby
        </button>

        <button
          class="secondary"
          onclick="joinBaby()">
          Join with invite code
        </button>

      </div>

    </div>
  `;
}

async function createBaby() {

  const result =
    await db
      .from("babies")
      .insert({
        name:
          newBabyName.value ||
          "Baby",

        created_by:
          user.id
      })
      .select()
      .single();

  if (result.error) {
    alert(result.error.message);
    return;
  }

  await loadData();

  startApp();
}

async function joinBaby() {

  const code =
    prompt(
      "Enter the invite code from the other parent:"
    );

  if (!code) return;

  const result =
    await db
      .from("babies")
      .select("id")
      .eq(
        "invite_code",
        code.trim()
      )
      .single();

  if (result.error) {
    alert("Invalid invite code.");
    return;
  }

  const member =
    await db
      .from("baby_members")
      .insert({
        baby_id: result.data.id,
        user_id: user.id,
        role: "parent",
        invite_code: code.trim()
      });

  if (member.error) {
    alert(member.error.message);
    return;
  }

  await loadData();

  startApp();
}

function startApp() {

  tabs.style.display = "grid";

  render();

  setInterval(
    refreshEntries,
    5000
  );
}

async function refreshEntries() {

  if (!baby) return;

  const result =
    await db
      .from("baby_entries")
      .select("*")
      .eq("baby_id", baby.id)
      .order("start_at", {
        ascending: false
      });

  if (!result.error) {
    entries = result.data || [];
    render();
  }
}

function render() {

  if (currentTab === "home") {
    renderHome();
  }

  if (currentTab === "history") {
    renderHistory();
  }

  if (currentTab === "settings") {
    renderSettings();
  }

  document
    .querySelectorAll(".tabs button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.tab === currentTab
      );

    });
}

function renderHome() {

  const today =
    entriesForDate();

  const feeds =
    today.filter(
      e => e.type === "feed"
    );

  const sleeps =
    today.filter(
      e => e.type === "sleep"
    );

  const bottleOunces =
    feeds.reduce(
      (total, entry) =>
        total +
        (
          Number(
            getDetails(entry).amount
          ) || 0
        ),
      0
    );

  const sleepTime =
    sleeps.reduce(
      (total, entry) =>
        total +
        (
          (entry.end_at
            ? new Date(entry.end_at)
            : new Date()) -
          new Date(entry.start_at)
        ),
      0
    );

  const active =
    entries.find(
      e =>
        !e.end_at &&
        (
          e.type === "feed" ||
          e.type === "sleep"
        )
    );

  root.innerHTML = `

    <main class="app">

      <div class="row">

        <div>
          <h1>Baby Tracker</h1>

          <span class="muted">
            ${baby.name}
          </span>
        </div>

        <select id="babySelect">

          ${babies.map(
            b =>
              `<option value="${b.id}">
                ${b.name}
              </option>`
          ).join("")}

        </select>

      </div>

      <div
        class="row"
        style="margin:14px 0">

        <button
          onclick="changeDate(-1)">
          ‹
        </button>

        <b>
          ${
            selectedDate === getLocalDate()
              ? "Today"
              : selectedDate
          }
        </b>

        <button
          onclick="changeDate(1)">
          ›
        </button>

      </div>

      <div class="stats">

        <div class="stat">
          Feedings
          <b>${feeds.length}</b>
        </div>

        <div class="stat">
          Bottle
          <b>${bottleOunces} oz</b>
        </div>

        <div class="stat">
          Sleep
          <b>${duration(sleepTime)}</b>
        </div>

        <div class="stat">
          Entries
          <b>${today.length}</b>
        </div>

      </div>

      <div class="quick">

        <button
          class="feed-button"
          onclick="startTracking('feed')">

          ▶️ 🍼

          <br>

          ${
            active?.type === "feed"
              ? "Stop"
              : "Start"
          }
          Feeding

        </button>

        <button
          class="sleep-button"
          onclick="startTracking('sleep')">

          ▶️ 😴

          <br>

          ${
            active?.type === "sleep"
              ? "Stop"
              : "Start"
          }
          Sleep

        </button>

      </div>

      <div class="card">

        <b>
          Quick log
        </b>

        <div class="activity-grid">

          <button
            class="activity"
            onclick="simpleForm('diaper')">

            🧷
            <span>Diaper</span>

          </button>

          <button
            class="activity"
            onclick="simpleForm('medication')">

            💊
            <span>Medicine</span>

          </button>

          <button
            class="activity"
            onclick="simpleForm('bath')">

            🛁
            <span>Bath</span>

          </button>

          <button
            class="activity"
            onclick="simpleForm('play')">

            🧸
            <span>Play</span>

          </button>

          <button
            class="activity"
            onclick="simpleForm('mood')">

            😊
            <span>Mood</span>

          </button>

        </div>

      </div>

      ${
        active
          ? `
            <div class="card">

              <b>
                Currently tracking:
              </b>

              ${entryTitle(active)}

              <button
                onclick="stopTracking('${active.id}')">

                Stop

              </button>

            </div>
          `
          : ""
      }

      <div class="card">

        <div class="row">

          <b>
            Today's log
          </b>

          <button
            onclick="
              currentTab='history';
              render();
            ">

            History

          </button>

        </div>

        ${
          today.length
            ? today.map(entryHTML).join("")
            : `
              <div
                class="muted"
                style="
                  padding:20px;
                  text-align:center
                ">

                Nothing logged yet.

              </div>
            `
        }

      </div>

    </main>
  `;

  babySelect.value = baby.id;

  babySelect.onchange =
    async () => {

      baby =
        babies.find(
          b => b.id === babySelect.value
        );

      await loadData();

      render();
    };
}

function changeDate(amount) {

  const date =
    new Date(
      selectedDate + "T12:00"
    );

  date.setDate(
    date.getDate() + amount
  );

  selectedDate =
    getLocalDate(date);

  render();
}

async function startTracking(type) {

  const active =
    entries.find(
      e =>
        !e.end_at &&
        (
          e.type === "feed" ||
          e.type === "sleep"
        )
    );

  if (active) {
    stopTracking(active.id);
    return;
  }

  if (type === "feed") {

    showModal(`

      <h2>
        Start Feeding
      </h2>

      <button
        class="primary"
        onclick="
          startLive(
            'feed',
            {
              method:'breast',
              side:'both'
            }
          )
        ">

        🤱 Breastfeeding

      </button>

      <button
        class="secondary"
        onclick="
          startLive(
            'feed',
            {
              method:'bottle',
              source:'breastmilk',
              amount:0
            }
          )
        ">

        🍼 Bottle

      </button>

      <button
        class="secondary"
        onclick="closeModal()">

        Cancel

      </button>

    `);

  } else {

    showModal(`

      <h2>
        Start Sleep
      </h2>

      <button
        class="primary"
        onclick="
          startLive(
            'sleep',
            {
              category:'nap'
            }
          )
        ">

        ☀️ Nap

      </button>

      <button
        class="secondary"
        onclick="
          startLive(
            'sleep',
            {
              category:'night'
            }
          )
        ">

        🌙 Night sleep

      </button>

      <button
        class="secondary"
        onclick="closeModal()">

        Cancel

      </button>

    `);
  }
}

async function startLive(type, details) {

  const result =
    await db
      .from("baby_entries")
      .insert({

        baby_id: baby.id,

        user_id: user.id,

        type,

        start_at:
          new Date().toISOString(),

        details

      });

  if (result.error) {
    alert(result.error.message);
    return;
  }

  closeModal();

  await loadData();

  render();
}

async function stopTracking(id) {

  const entry =
    entries.find(
      e => e.id === id
    );

  const end =
    new Date().toISOString();

  const d =
    getDetails(entry);

  let extra = "";

  if (
    entry.type === "feed" &&
    d.method === "bottle"
  ) {

    extra = `

      <div class="field">

        <label>
          Amount (oz)
        </label>

        <input
          id="finishAmount"
          type="number"
          step="0.1">

      </div>

    `;
  }

  if (
    entry.type === "feed" &&
    d.method === "breast"
  ) {

    extra = `

      <div class="field">

        <label>
          Breast
        </label>

        <div
          class="segment"
          id="finishSide">

          <button data-value="left">
            Left
          </button>

          <button data-value="right">
            Right
          </button>

          <button
            data-value="both"
            class="selected">

            Both

          </button>

        </div>

      </div>

    `;
  }

  showModal(`

    <h2>
      ${entryTitle(entry)} finished
    </h2>

    <p class="muted">

      ${duration(
        new Date(end) -
        new Date(entry.start_at)
      )}

    </p>

    ${extra}

    <button
      class="primary"
      onclick="
        finishTracking(
          '${id}',
          '${end}'
        )
      ">

      Save

    </button>

  `);

  document
    .querySelectorAll(
      "#finishSide button"
    )
    .forEach(button => {

      button.onclick = () => {

        document
          .querySelectorAll(
            "#finishSide button"
          )
          .forEach(b =>
            b.classList.remove(
              "selected"
            )
          );

        button.classList.add(
          "selected"
        );
      };

    });
}

async function finishTracking(id, end) {

  const entry =
    entries.find(
      e => e.id === id
    );

  const d =
    getDetails(entry);

  if (
    entry.type === "feed" &&
    d.method === "bottle"
  ) {

    d.amount =
      Number(
        finishAmount.value || 0
      );
  }

  if (
    entry.type === "feed" &&
    d.method === "breast"
  ) {

    d.side =
      document
        .querySelector(
          "#finishSide .selected"
        )
        ?.dataset.value ||
      "both";
  }

  const result =
    await db
      .from("baby_entries")
      .update({
        end_at: end,
        details: d
      })
      .eq("id", id);

  if (result.error) {
    alert(result.error.message);
    return;
  }

  closeModal();

  await loadData();

  render();
}

function showModal(html) {

  sheet.innerHTML = html;

  modal.style.display = "flex";
}

function closeModal() {

  modal.style.display = "none";
}

function simpleForm(type, existing = null) {

  const d =
    getDetails(existing || {});

  let html = `

    <h2>
      ${existing ? "Edit " : "Log "}
      ${type}
    </h2>

    <div class="field">

      <label>
        Date & time
      </label>

      <input
        id="simpleWhen"
        type="datetime-local"
        value="${
          existing
            ? dateTimeInput(
                new Date(
                  existing.start_at
                )
              )
            : dateTimeInput()
        }">

    </div>

  `;

  if (type === "diaper") {

    html += `

      <div class="field">

        <label>
          Type
        </label>

        <div
          class="segment"
          id="diaperType">

          <button data-value="wet">
            Wet
          </button>

          <button data-value="dirty">
            Dirty
          </button>

          <button data-value="both">
            Both
          </button>

        </div>

      </div>

    `;
  }

  if (type === "medication") {

    html += `

      <div class="field">

        <label>
          Medication
        </label>

        <input
          id="medicationName"
          value="${d.name || ""}">

      </div>

      <div class="field">

        <label>
          Dose
        </label>

        <input
          id="medicationDose"
          type="number"
          step="0.01"
          value="${d.dose || ""}">

      </div>

      <div class="field">

        <label>
          Unit
        </label>

        <select id="medicationUnit">

          <option>mL</option>
          <option>mg</option>
          <option>tsp</option>
          <option>tablet</option>
          <option>other</option>

        </select>

      </div>

    `;
  }

  if (type === "mood") {

    html += `

      <div class="field">

        <label>
          Mood
        </label>

        <div
          class="segment"
          id="moodType">

          <button data-value="😍 Great">
            😍
          </button>

          <button data-value="😊 Happy">
            😊
          </button>

          <button data-value="😐 Neutral">
            😐
          </button>

          <button data-value="😢 Fussy">
            😢
          </button>

          <button data-value="😭 Very upset">
            😭
          </button>

        </div>

      </div>

    `;
  }

  html += `

    <div class="field">

      <label>
        Notes
      </label>

      <textarea id="simpleNotes">${
        existing?.notes || ""
      }</textarea>

    </div>

    <button
      class="primary"
      onclick="
        saveSimple(
          '${type}',
          '${existing?.id || ""}'
        )
      ">

      Save

    </button>

    <button
      class="secondary"
      onclick="closeModal()">

      Cancel

    </button>

  `;

  showModal(html);

  if (type === "diaper") {
    setupSegment(
      "diaperType",
      d.kind || "wet"
    );
  }

  if (type === "mood") {
    setupSegment(
      "moodType",
      d.mood || "😊 Happy"
    );
  }
}

function setupSegment(id, selected) {

  document
    .querySelectorAll(
      "#" + id + " button"
    )
    .forEach(button => {

      button.classList.toggle(
        "selected",
        button.dataset.value === selected
      );

      button.onclick = () => {

        document
          .querySelectorAll(
            "#" + id + " button"
          )
          .forEach(b =>
            b.classList.remove(
              "selected"
            )
          );

        button.classList.add(
          "selected"
        );
      };

    });
}

async function saveSimple(type, id) {

  const details = {};

  if (type === "diaper") {

    details.kind =
      document
        .querySelector(
          "#diaperType .selected"
        )
        ?.dataset.value ||
      "wet";
  }

  if (type === "medication") {

    details.name =
      medicationName.value;

    details.dose =
      Number(
        medicationDose.value || 0
      );

    details.unit =
      medicationUnit.value;
  }

  if (type === "mood") {

    details.mood =
      document
        .querySelector(
          "#moodType .selected"
        )
        ?.dataset.value ||
      "😊 Happy";
  }

  const payload = {

    baby_id: baby.id,

    user_id: user.id,

    type,

    start_at:
      new Date(
        simpleWhen.value
      ).toISOString(),

    details,

    notes:
      simpleNotes.value

  };

  let result;

  if (id) {

    result =
      await db
        .from("baby_entries")
        .update(payload)
        .eq("id", id);

  } else {

    result =
      await db
        .from("baby_entries")
        .insert(payload);

  }

  if (result.error) {

    alert(result.error.message);

    return;
  }

  closeModal();

  await loadData();

  render();
}

function editEntry(id) {

  const entry =
    entries.find(
      e => e.id === id
    );

  if (!entry) return;

  if (entry.type === "feed") {

    editFeeding(entry);

  } else if (entry.type === "sleep") {

    editSleep(entry);

  } else {

    simpleForm(
      entry.type,
      entry
    );
  }
}

function editFeeding(entry) {

  const d =
    getDetails(entry);

  let method =
    d.method || "bottle";

  showModal(`

    <h2>
      Edit Feeding
    </h2>

    <div class="field">

      <label>
        Feeding type
      </label>

      <div
        class="segment"
        id="feedingType">

        <button data-value="bottle">
          Bottle
        </button>

        <button data-value="breast">
          Breast
        </button>

      </div>

    </div>

    <div class="field">

      <label>
        Start
      </label>

      <input
        id="feedingStart"
        type="datetime-local"
        value="${dateTimeInput(
          new Date(entry.start_at)
        )}">

    </div>

    <div class="field">

      <label>
        End
      </label>

      <input
        id="feedingEnd"
        type="datetime-local"
        value="${
          entry.end_at
            ? dateTimeInput(
                new Date(
                  entry.end_at
                )
              )
            : ""
        }">

    </div>

    <div id="feedingFields"></div>

    <button
      class="primary"
      onclick="
        saveFeeding(
          '${entry.id}'
        )
      ">

      Save

    </button>

  `);

  setupSegment(
    "feedingType",
    method
  );

  function fields() {

    if (method === "bottle") {

      feedingFields.innerHTML = `

        <div class="field">

          <label>
            Amount (oz)
          </label>

          <input
            id="feedingAmount"
            type="number"
            step="0.1"
            value="${d.amount || ""}">

        </div>

        <div class="field">

          <label>
            Source
          </label>

          <select id="feedingSource">

            <option value="breastmilk">
              Breast milk
            </option>

            <option value="formula">
              Formula
            </option>

          </select>

        </div>

      `;

      feedingSource.value =
        d.source || "breastmilk";

    } else {

      feedingFields.innerHTML = `

        <div class="field">

          <label>
            Breast
          </label>

          <div
            class="segment"
            id="breastType">

            <button data-value="left">
              Left
            </button>

            <button data-value="right">
              Right
            </button>

            <button data-value="both">
              Both
            </button>

          </div>

        </div>

      `;

      setupSegment(
        "breastType",
        d.side || "both"
      );
    }
  }

  fields();

  document
    .querySelectorAll(
      "#feedingType button"
    )
    .forEach(button => {

      button.onclick = () => {

        method =
          button.dataset.value;

        setupSegment(
          "feedingType",
          method
        );

        fields();
      };

    });
}

async function saveFeeding(id) {

  const method =
    document
      .querySelector(
        "#feedingType .selected"
      )
      .dataset.value;

  const details = {
    method
  };

  if (method === "bottle") {

    details.amount =
      Number(
        feedingAmount.value || 0
      );

    details.source =
      feedingSource.value;

  } else {

    details.side =
      document
        .querySelector(
          "#breastType .selected"
        )
        ?.dataset.value ||
      "both";
  }

  const result =
    await db
      .from("baby_entries")
      .update({

        start_at:
          new Date(
            feedingStart.value
          ).toISOString(),

        end_at:
          feedingEnd.value
            ? new Date(
                feedingEnd.value
              ).toISOString()
            : null,

        details

      })
      .eq("id", id);

  if (result.error) {

    alert(result.error.message);

    return;
  }

  closeModal();

  await loadData();

  render();
}

  showModal(`

      <label>
        Sleep type

async function saveSleep(id) {

  const result =
    await db
      .from("baby_entries")
      .update({

        start_at:
          new Date(
            sleepStart.value
          ).toISOString(),

        end_at:
          sleepEnd.value
            ? new Date(
                sleepEnd.value
              ).toISOString()
            : null,

        details: {
          category:
            document
              .querySelector(
                "#sleepType .selected"
              )
              .dataset.value
        }

      })
      .eq("id", id);

  if (result.error) {

    alert(result.error.message);

    return;
  }

  closeModal();

  await loadData();

  render();
}

async function deleteEntry(id) {

  if (
    !confirm(
      "Delete this entry?"
    )
  ) {
    return;
  }

  const result =
    await db
      .from("baby_entries")
      .delete()
      .eq("id", id);

  if (result.error) {

    alert(result.error.message);

    return;
  }

  await loadData();

  render();
}

document
  .querySelectorAll(
    ".tabs button"
  )
  .forEach(button => {

    button.onclick = () => {

      currentTab =
        button.dataset.tab;

      render();
    };

  });

db.auth
  .getSession()
  .then(async result => {

    user =
      result.data.session?.user;

    if (!user) {

      showAuth();

      return;
    }

    await loadData();

    if (babies.length) {

      startApp();

    } else {

      showBabySetup();
    }

  });

db.auth.onAuthStateChange(
  async (event, session) => {

    if (
      session?.user &&
      !user
    ) {

      user =
        session.user;

      await loadData();

      if (babies.length) {

        startApp();

      } else {

        showBabySetup();
      }
    }

  }
);
